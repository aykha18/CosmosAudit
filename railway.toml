# Railway configuration for CosmoAudit
# This file configures different build settings for different services

# Default build settings (for services without specific config)
[build]
builder = "nixpacks"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# Service-specific configurations
[services.cusmoaudit-web]
builder = "nixpacks"
buildCommand = "npm run build"
startCommand = "npm start"

[services.cosmosaudit]
builder = "dockerfile"
dockerfilePath = "Dockerfile.backup"